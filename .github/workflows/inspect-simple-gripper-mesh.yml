name: Inspect supplied simple-gripper mesh
on:
  push:
    paths:
      - ".github/workflows/inspect-simple-gripper-mesh.yml"
      - "simple_gripper/inspect_reference_mesh.py"
      - "Michelangelo Dealberti FInal Clamp Design.stl"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Inventory mesh components
        run: python3 simple_gripper/inspect_reference_mesh.py
      - name: Commit component inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simple_gripper/reference_mesh_components.md simple_gripper/reference_mesh_axis_sections.md
          git commit -m "Inventory supplied clamp mesh components" || exit 0
          git push
