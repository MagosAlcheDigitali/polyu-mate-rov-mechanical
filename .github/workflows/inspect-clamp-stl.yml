name: Inspect supplied clamp mesh
on:
  push:
    paths:
      - ".github/workflows/inspect-clamp-stl.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Analyze the supplied STL with Python standard library
        run: |
          python3 - <<'PY'
          import json, math, struct, urllib.request
          url = "https://raw.githubusercontent.com/MagosAlcheDigitali/polyu-mate-rov-mechanical/main/Michelangelo%20Dealberti%20FInal%20Clamp%20Design.stl"
          data = urllib.request.urlopen(url, timeout=30).read()
          if len(data) < 84:
              raise SystemExit(f"STL too short: {len(data)} bytes")
          count = struct.unpack_from("<I", data, 80)[0]
          expected = 84 + 50 * count
          if expected != len(data):
              raise SystemExit(f"Not binary STL: bytes={len(data)} header_triangle_count={count} expected={expected}")
          triangles = []
          for i in range(count):
              off = 84 + 50 * i
              vals = struct.unpack_from("<12f", data, off)
              triangles.append((vals[3:6], vals[6:9], vals[9:12]))

          parent = list(range(count))
          rank = [0] * count
          def find(x):
              while parent[x] != x:
                  parent[x] = parent[parent[x]]
                  x = parent[x]
              return x
          def union(a, b):
              ra, rb = find(a), find(b)
              if ra == rb:
                  return
              if rank[ra] < rank[rb]:
                  ra, rb = rb, ra
              parent[rb] = ra
              if rank[ra] == rank[rb]:
                  rank[ra] += 1
          vertex_owner = {}
          for i, tri in enumerate(triangles):
              for v in tri:
                  key = tuple(round(x, 3) for x in v)
                  j = vertex_owner.setdefault(key, i)
                  union(i, j)

          groups = {}
          for i, tri in enumerate(triangles):
              groups.setdefault(find(i), []).append(tri)

          def component_report(tris):
              pts = [v for tri in tris for v in tri]
              mins = [min(v[k] for v in pts) for k in range(3)]
              maxs = [max(v[k] for v in pts) for k in range(3)]
              area = 0.0
              volume6 = 0.0
              for a,b,c in tris:
                  u = [b[k]-a[k] for k in range(3)]
                  v = [c[k]-a[k] for k in range(3)]
                  cross = [u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]]
                  area += 0.5*math.sqrt(sum(q*q for q in cross))
                  volume6 += a[0]*cross[0]+a[1]*cross[1]+a[2]*cross[2]
              return {
                  "triangles":len(tris),
                  "min_xyz":[round(x,3) for x in mins],
                  "max_xyz":[round(x,3) for x in maxs],
                  "size_xyz":[round(maxs[k]-mins[k],3) for k in range(3)],
                  "center_xyz":[round((maxs[k]+mins[k])/2,3) for k in range(3)],
                  "surface_area_mm2":round(area,2),
                  "signed_volume_mm3":round(volume6/6,2)
              }

          components = sorted((component_report(v) for v in groups.values()),
                              key=lambda c:c["triangles"], reverse=True)
          # Render a compact orthographic SVG, color-coded by disconnected STL component.
          import colorsys, base64
          component_groups = sorted(groups.items(), key=lambda kv:len(kv[1]), reverse=True)
          palette = []
          for idx in range(len(component_groups)):
              rgb = colorsys.hsv_to_rgb((idx*0.61803398875)%1,0.70,0.82)
              palette.append("#%02x%02x%02x" % tuple(int(255*x) for x in rgb))
          projection_defs = [
              ("Front: X / Z",0,2,1),
              ("Side: Y / Z",1,2,0),
              ("Top: X / Y",0,1,2)
          ]
          svg = ['<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430">']
          svg.append('<rect width="1120" height="430" fill="white"/>')
          svg.append('<text x="20" y="24" font-family="sans-serif" font-size="18" font-weight="bold">Supplied clamp STL — component orthographic projections</text>')
          sample_step = max(1, count//300)
          view_w, view_h, gap, top = 340, 350, 25, 48
          for vi,(title,ax1,ax2,depth) in enumerate(projection_defs):
              vx = 20 + vi*(view_w+gap)
              amin = min(v[ax1] for tri in triangles for v in tri)
              amax = max(v[ax1] for tri in triangles for v in tri)
              bmin = min(v[ax2] for tri in triangles for v in tri)
              bmax = max(v[ax2] for tri in triangles for v in tri)
              scale = min((view_w-20)/max(1e-6,amax-amin),(view_h-20)/max(1e-6,bmax-bmin))
              ox = vx + (view_w-(amax-amin)*scale)/2
              oy = top + (view_h-(bmax-bmin)*scale)/2
              svg.append('<text x="%s" y="%s" font-family="sans-serif" font-size="14" font-weight="bold">%s</text>' % (vx,top-8,title))
              svg.append('<rect x="%s" y="%s" width="%s" height="%s" fill="none" stroke="#999"/>' % (vx,top,view_w,view_h))
              for ci,(root,tris) in enumerate(component_groups):
                  col = palette[ci]
                  for ti in range(0,len(tris),sample_step):
                      tri = tris[ti]
                      pts = []
                      for v in tri:
                          px = ox + (v[ax1]-amin)*scale
                          py = oy + (bmax-v[ax2])*scale
                          pts.append("%.1f,%.1f" % (px,py))
                      svg.append('<polygon points="%s" fill="%s" fill-opacity="0.48" stroke="%s" stroke-width="0.22"/>' % (" ".join(pts),col,col))
          svg.append('</svg>')
          svg_text = "".join(svg)
          print("CLAMP_SVG_B64_BEGIN")
          svg_b64 = base64.b64encode(svg_text.encode()).decode()
          for pos in range(0,len(svg_b64),6000):
              print(svg_b64[pos:pos+6000])
          print("CLAMP_SVG_B64_END")
          all_pts = [v for tri in triangles for v in tri]
          report = {
              "bytes":len(data),
              "binary_triangle_count":count,
              "component_count":len(components),
              "whole_mesh_min_xyz":[round(min(v[k] for v in all_pts),3) for k in range(3)],
              "whole_mesh_max_xyz":[round(max(v[k] for v in all_pts),3) for k in range(3)],
              "components_largest_first":components[:30],
              "component_method":"triangles joined by vertices quantized to 0.001 mm"
          }
          print("CLAMP_STL_REPORT_BEGIN")
          print(json.dumps(report, separators=(",",":")))
          print("CLAMP_STL_REPORT_END")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"w") as f:
              f.write("# Supplied clamp STL geometry report\n\n")
              f.write("Read-only analysis of the repository's original STL.\n\n")
              f.write("```json\n"+json.dumps(report,indent=2)+"\n```\n")
          PY
