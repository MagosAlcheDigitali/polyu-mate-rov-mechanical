<rect width="1280" height="760" fill="#f4f8fa"/>
<text x="54" y="58" font-family="Arial" font-size="28" font-weight="700" fill="#183346">Stop-sector guard enclosure candidate</text>
<text x="54" y="88" font-family="Arial" font-size="15" fill="#557082">Unpowered packaging study · split lower panels · nominal gaps only · not an inspection pass</text>
