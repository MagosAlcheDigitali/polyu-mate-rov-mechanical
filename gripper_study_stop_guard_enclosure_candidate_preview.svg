  <text x="83" y="365" font-size="12" fill="#567282">split lower panels z=10.3–11.8</text>
  <text x="347" y="91" font-size="12" fill="#28495b">removable lid z=33–35</text>
  <text x="351" y="184" font-size="12" fill="#7b4e2c">stop plate</text>
  <text x="367" y="241" font-size="12" fill="#35596b">fork / shaft</text>
  <text x="300" y="303" font-size="12" fill="#35596b">upper bearing ear</text>
  <text x="306" y="326" font-size="12" fill="#b05f32">0.7 mm to pin head</text>
  <text x="66" y="405" font-size="13" fill="#456273">Full 360° radial wall · 10 mm nominal stop-sector clearance</text>
  <text x="66" y="428" font-size="13" fill="#456273">Ø9 mm lower screw heads bridge Ø7.3 mm boss reliefs</text>
  <text x="66" y="450" font-size="13" fill="#456273">0.2 mm shell/flange gap above the split floor</text>
  <text x="66" y="470" font-size="13" fill="#9b4c31" font-weight="700">Physical fit, tolerances, materials, loads, and inspection remain unverified.</text>
