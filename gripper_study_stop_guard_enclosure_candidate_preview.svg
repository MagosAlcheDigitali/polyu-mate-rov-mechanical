    <circle cx="77.78" cy="-77.78" r="7"/><circle cx="-77.78" cy="-77.78" r="7"/>
    <circle cx="-106" cy="28.5" r="7"/><circle cx="77.78" cy="77.78" r="7"/>
  </g>
  <text x="-24" y="-33" fill="#fff" font-family="Arial" font-size="11" font-weight="700">32 × 40</text>
  <text x="-21" y="-19" fill="#fff" font-family="Arial" font-size="10">upper bearing</text>
  <text x="9" y="76" fill="#8c4a20" font-family="Arial" font-size="11">0.4 mm split</text>
  <text x="-123" y="149" fill="#526f80" font-family="Arial" font-size="12">100 mm skirt / panel envelope · one screw shifted to 165°</text>
