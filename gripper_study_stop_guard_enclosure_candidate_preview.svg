  <text x="70" y="628" font-size="14" font-weight="700">Nominal gaps: shaft 11.8 · cheek/wall port 12.4 × 12 · seam 0.4 mm</text>
  <text x="70" y="651" font-size="12">Large bracket/rail/tie reliefs rely on solid parts filling them; verify assembled fit physically.</text>
</g>
